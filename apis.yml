aid: eon-pass
name: Eon Pass
description: >-
  Eon Pass (EonPass) is an AI-powered anti-counterfeiting and brand-protection
  software platform. It helps brand-protection and enforcement teams identify,
  investigate, and take down counterfeiters by analyzing more than 24 data
  sources — including marketplace activity, corporate records, logistics data,
  and investigation signals — to build comprehensive profiles of suspected bad
  actors. Teams track suspects, manage cases, and coordinate enforcement actions
  from a unified dashboard, with the platform reporting takedown-efficiency
  improvements of up to 20%. Eon Pass is a portfolio company of 500 Global. No
  public API, SDK, or developer surface is currently published; this profile is
  maintained as an enrichment lead in the API Evangelist network.
